    <!-- Google Search Console -->

    />

    <!-- Auto-réparation des anciens liens partagés sans "#" -->
    <script>
      (function () {
        if (window.location.hash) return;

        var path = window.location.pathname;
        var base =
          path.indexOf('/omedevservice/') === 0
            ? '/omedevservice/'
            : '/';

        if (path === base) return;

        var route = path.slice(base.length);

        window.location.replace(
          base + '#/' + route + window.location.search
        );
      })();
    </script>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
