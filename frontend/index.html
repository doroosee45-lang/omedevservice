<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />

    <!-- Auto-réparation des anciens liens partagés sans "#" (ex:
         /blog/mon-article) vers le format HashRouter correct
         (/#/blog/mon-article). Doit s'exécuter avant tout autre script,
         et nécessite que l'hébergeur serve bien index.html pour ces
         chemins (règle de rewrite "/* -> /index.html"). -->
    <script>
      (function () {
        if (window.location.hash) return;
        var path = window.location.pathname;
        var base = path.indexOf('/omedevservice/') === 0 ? '/omedevservice/' : '/';
        if (path === base) return;
        var route = path.slice(base.length);
        window.location.replace(base + '#/' + route + window.location.search);
      })();
    </script>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Viewport: viewport-fit=cover pour le support notch iPhone -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Android Chrome — couleur de la barre d'adresse -->
    <meta name="theme-color" content="#0f172a" />

    <!-- PWA — plein écran (standard + iOS Safari) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OMEDEV" />

    <!-- Préconnexion Google Fonts pour réduire la latence -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <title>OMEDEV Services - Solutions IT, Énergie & Digital</title>
    <meta name="description" content="Leader en solutions informatiques, énergétiques et digitales en République Démocratique du Congo" />
    <meta name="keywords" content="IT, réseau, sécurité, cloud, énergie, formation, RDC" />
    <meta name="author" content="OMEDEV Services" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
