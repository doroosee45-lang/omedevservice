services:
  # ── BACKEND (API Node/Express) ─────────────────────────────────────────────
  - type: web
    name: omedev-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false          # à saisir manuellement dans le dashboard Render
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRE
        value: 30d
      # SMTP (Gmail) — abandonné : Render bloque/timeout les connexions
      # sortantes vers smtp.gmail.com:587 (ETIMEDOUT confirmé), remplacé
      # par RESEND_API_KEY ci-dessous (API HTTPS).
      - key: CONTACT_EMAIL
        sync: false          # adresse qui reçoit les notifications internes
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false          # optionnel : seulement une fois un domaine vérifié sur resend.com/domains
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false          # ex: https://omedev-frontend.onrender.com
      - key: CLOUDINARY_CLOUD_NAME
        sync: false          # stockage des images d'articles (disque local éphémère sur Render)
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  # ── FRONTEND (React/Vite, static site) ──────────────────────────────────────
  - type: web
    name: omedev-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html   # gère le routing React SPA (HashRouter n'en a pas besoin, mais ne gêne pas)
    envVars:
      - key: VITE_API_URL
        sync: false                # ex: https://omedev-backend.onrender.com/api
